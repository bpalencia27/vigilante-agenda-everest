name: tests

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

env:
  # Umbral de cobertura estricto (funciones cubiertas como mínimo) para evitar regresiones
  MIN_COVERAGE: 266

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Run tests
      run: |
        set +e
        npm test > runner_output.txt 2>&1
        EXIT_CODE=$?
        set -e
        cat runner_output.txt

        # 1. Compuerta de fallos: EXIT_CODE se capturaba pero JAMÁS se comprobaba
        # (hallado en revisión adversarial 2026-08-11: pruebas en rojo daban CI verde).
        if [ "$EXIT_CODE" -ne 0 ]; then
          echo "Error: el runner terminó con código $EXIT_CODE (pruebas fallidas o muerte del proceso)."
          exit "$EXIT_CODE"
        fi

        # 2. Defensa doble por si el código de salida mintiera: la línea de resumen
        # solo contiene "fallan" cuando el contador de fallos es mayor que cero.
        if grep -Eq "comprobaciones.*fallan" runner_output.txt; then
          echo "Error: el resumen del runner reporta pruebas que fallan."
          exit 1
        fi

        # 4. Compuerta de silencio: el paso de tests debe fallar si la salida
        # NO contiene la línea "comprobaciones" del resumen final.
        if ! grep -q "comprobaciones" runner_output.txt; then
          echo "Error: el proceso murió en silencio o se colgó (no se halló 'comprobaciones')."
          exit 1
        fi

        # 3. Compuerta de cobertura: parsear la línea "funciones cubiertas: X / Y"
        # y fallar si X < 266.
        COBERTURA=$(grep -Eo 'funciones cubiertas: [0-9]+' runner_output.txt | awk '{print $3}')
        if [ -z "$COBERTURA" ]; then
          echo "Error: no se encontró la línea de cobertura en la salida."
          exit 1
        fi

        if [ "$COBERTURA" -lt "$MIN_COVERAGE" ]; then
          echo "Error: Cobertura insuficiente ($COBERTURA < $MIN_COVERAGE funciones)."
          exit 1
        fi
