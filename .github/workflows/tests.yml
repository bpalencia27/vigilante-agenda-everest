name: tests

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

env:
  # Umbral de cobertura estricto (funciones cubiertas como mínimo) para evitar regresiones
  MIN_COVERAGE: 351
  # v17.15.0 — sin esto el banco corre en UTC y arrastra una falla PREEXISTENTE y ajena en
  # suite_03 (v17.6.39: una fecha sin sufijo de zona, que el runtime lee en hora local). Las
  # cuatro compuertas de abajo nacían en rojo por algo que no es un defecto. America/Bogota
  # es la zona real de uso y la que este proyecto documenta para correr el banco.
  TZ: America/Bogota

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Run tests
      run: |
        set +e
        npm test > runner_output.txt 2>&1
        EXIT_CODE=$?
        set -e
        cat runner_output.txt

        # 1. Compuerta de estado: el paso falla si el código de salida no es 0
        if [ "$EXIT_CODE" -ne 0 ]; then
          echo "Error: el código de salida no es 0 ($EXIT_CODE)."
          exit 1
        fi

        # 2. Compuerta de silencio: el paso de tests debe fallar si la salida
        # NO contiene la línea "comprobaciones : ... pasan" del resumen final.
        if ! grep -qE "comprobaciones :.*pasan" runner_output.txt; then
          echo "Error: el proceso murió en silencio o se colgó (no se halló 'comprobaciones : ... pasan')."
          exit 1
        fi

        # 3. Compuerta de fallos: el paso debe fallar si se detectan pruebas fallidas.
        if grep -qE "[1-9][0-9]* fallan" runner_output.txt; then
          echo "Error: se detectaron pruebas fallidas."
          exit 1
        fi

        # 4. Compuerta de cobertura: parsear la línea "funciones cubiertas: X / Y"
        # y fallar si X < 266.
        COBERTURA=$(grep -Eo 'funciones cubiertas: [0-9]+' runner_output.txt | awk '{print $3}')
        if [ -z "$COBERTURA" ]; then
          echo "Error: no se encontró la línea de cobertura en la salida."
          exit 1
        fi

        if [ "$COBERTURA" -lt "$MIN_COVERAGE" ]; then
          echo "Error: Cobertura insuficiente ($COBERTURA < $MIN_COVERAGE funciones)."
          exit 1
        fi
